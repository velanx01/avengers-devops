<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Character Details</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Character Header -->

    <header class="character-header">

        <a href="index.html" class="back-button">
            ← Back to Avengers
        </a>

        <h1 id="character-name">
            Character
        </h1>

    </header>


    <!-- Character Details -->

    <main class="character-details">

        <div class="character-profile">

            <img id="character-image"
                 src=""
                 alt="Character">

            <div class="character-info">

                <h2 id="character-title">
                    Character Name
                </h2>

                <p id="character-description">
                    Character description
                </p>

            </div>

        </div>


        <!-- Movies -->

        <section class="character-movies">

            <h2>
                🎬 Movies
            </h2>

            <div id="movies" class="movies">

                <!-- Movies will appear here -->

            </div>

        </section>

    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
